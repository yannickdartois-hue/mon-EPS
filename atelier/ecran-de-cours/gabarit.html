<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{{couleur}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{nom_ecran}}">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png">
<title>{{titre}}</title>
<!-- Page FABRIQUÉE par mon-eps/atelier/ecran-de-cours/construire.py : ne pas la modifier à la main ici.
     Moteur commun : ecran.js et ecran.css. Propre à l'activité : le <style> et le <script> ci-dessous. -->
<link rel="stylesheet" href="ecran.css">
<style>
/* ===== Propre au cycle {{nom_long}} : couleurs, niveaux, schémas ===== */
{{css}}
</style>
<style>/* Lisibilité terrain : textes à 15 px minimum à l'écran ; tailles d'origine à l'impression. */@media print{:root{--fs-min:0px}}</style>
<link rel="stylesheet" href="eps-charte-v1.css">
<style>/* Charte v1 : couleur de l'activité et teinte de chaque cycle (calculées par construire.py) */
{{charte}}
</style>
</head>
<body>
<header class="barre">
  <img src="icon-192.png" alt="">
  <div class="app">{{nom}}<small>Lycée Pompidou</small></div>
  <span class="pastille-niv" id="cyPast">{{pastille}}</span>
  <div class="titre" id="titre"></div>
{{liens}}  <a class="bt clair" id="prep" href="{{old}}">Préparer</a>
  <button class="bt clair baide" type="button" onclick="EPSAide.ouvrir()" aria-label="Mode d’emploi" title="Mode d’emploi">?</button>
</header>
<div class="trace"></div>
<div class="niveau" id="niveau"></div>
<section class="deroule" id="deroule" aria-label="Déroulé de la séance"></section>
<main class="zone" id="zone"></main>
<footer class="pouce">
  <button class="bt bord" id="btSeances" type="button">‹ Séances</button>
  <button class="bt bord" id="btOutils" type="button">Outils</button>
  <button class="bt bord" id="btAjuster" type="button">Ajuster le déroulé</button>
  <div class="info" id="info"></div>
</footer>
<div id="couche"></div>

<script src="{{donnees}}"></script>
<script>
'use strict';
{{config}}</script>
<script src="ecran.js"></script>
<script src="aide-ecran.js"></script>
<script src="eps-aide.js"></script>
</body>
</html>
