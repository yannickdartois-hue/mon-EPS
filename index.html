<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<script>try{const t=localStorage.getItem("portail-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --border:#30363d;
  --text:#e6edf3; --text-muted:#8b949e;
  --accent-1:#f97316; --accent-2:#22d3ee; --accent-3:#4ade80; --accent-4:#a78bfa;
  --radius:16px; --shadow:0 8px 32px rgba(0,0,0,.55); --transition:.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f0f4f8; --surface:#fff; --surface2:#e8edf3; --border:#d0d7de;
  --text:#1c2128; --text-muted:#57606a; --shadow:0 8px 32px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Nunito,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  transition:background var(--transition),color var(--transition);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(80% 60% at 20% 10%,rgba(249,115,22,.07) 0%,transparent 60%),
             radial-gradient(60% 50% at 80% 90%,rgba(34,211,238,.06) 0%,transparent 60%)}

/* ---------- Header ---------- */
header{position:relative;z-index:10;padding:2rem 2rem 0;max-width:1300px;margin:0 auto}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.85rem}
.logo-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;color:#fff;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));box-shadow:0 0 20px rgba(249,115,22,.4)}
.logo-text h1{font-family:"Bebas Neue",sans-serif;font-size:2rem;letter-spacing:.08em;line-height:1;
  background:linear-gradient(90deg,var(--accent-1),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-text p{font-size:.78rem;color:var(--text-muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:.75rem}
.btn-icon{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:1rem;
  transition:background var(--transition),transform var(--transition)}
.btn-icon:hover{background:var(--surface2);transform:scale(1.08)}
.btn-add{display:flex;align-items:center;gap:.5rem;padding:.55rem 1.2rem;color:#fff;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--accent-1),#e05c00);font-family:Nunito,sans-serif;font-weight:800;font-size:.88rem;
  text-decoration:none;box-shadow:0 4px 15px rgba(249,115,22,.35);transition:transform var(--transition),box-shadow var(--transition)}
.btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(249,115,22,.55)}

/* ---------- Hero ---------- */
.hero{position:relative;z-index:5;max-width:1300px;margin:2.5rem auto 0;padding:0 2rem;text-align:center}
.hero h2{font-family:"Bebas Neue",sans-serif;font-size:clamp(2.8rem,7vw,5.5rem);letter-spacing:.06em;line-height:.95}
.hero h2 span{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:.85rem auto 0;color:var(--text-muted);font-size:1rem;font-weight:600;max-width:480px}
.stats{display:flex;justify-content:center;gap:2.5rem;margin-top:1.5rem;flex-wrap:wrap}
.stat{text-align:center}
.stat-num{font-family:"Bebas Neue",sans-serif;font-size:2rem;letter-spacing:.04em;color:var(--c,var(--accent-1))}
.stat-label{font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em}

/* ---------- Recherche & filtres ---------- */
.controls{position:relative;z-index:5;max-width:1300px;margin:2.5rem auto 0;padding:0 2rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.search-wrapper{position:relative;flex:1 1 0%;min-width:200px}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.9rem}
#searchInput{width:100%;padding:.75rem 1rem .75rem 2.7rem;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);font-family:Nunito,sans-serif;font-size:.95rem;font-weight:600;outline:none;
  transition:border-color var(--transition),box-shadow var(--transition)}
#searchInput:focus{border-color:var(--accent-1);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
#searchInput::placeholder{color:var(--text-muted)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap}
.pill{padding:.45rem 1rem;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  font-family:Nunito,sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all var(--transition);white-space:nowrap}
.pill:hover{transform:translateY(-1px);color:var(--text)}
.pill.active{background:var(--pc,var(--accent-1));border-color:var(--pc,var(--accent-1));color:#fff;
  box-shadow:0 2px 12px color-mix(in srgb,var(--pc,var(--accent-1)) 35%,transparent)}
.pill.opt{display:flex;align-items:center;gap:.45rem}
.pill.opt input{accent-color:var(--accent-1)}

/* ---------- Grille ---------- */
.grid-section{position:relative;z-index:5;max-width:1300px;margin:1rem auto 0;padding:0 2rem 4rem}
.category-label{display:flex;align-items:center;gap:.7rem;font-family:"Bebas Neue",sans-serif;font-size:1.6rem;
  letter-spacing:.1em;color:var(--text);margin:2.4rem 0 .2rem}
.category-label::after{content:"";flex:1;height:1px;background:var(--border)}
.category-label .n{font-family:Nunito,sans-serif;font-size:.75rem;font-weight:800;letter-spacing:0;padding:.15rem .6rem;border-radius:999px;
  color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent)}
.category-sub{font-size:.82rem;color:var(--text-muted);font-weight:600;margin-bottom:1.2rem}
.sub-label{display:flex;align-items:center;gap:.6rem;font-family:"Bebas Neue",sans-serif;font-size:1.15rem;letter-spacing:.1em;
  color:var(--text-muted);margin:2rem 0 1rem}
.sub-label::after{content:"";flex:1;height:1px;background:var(--border);opacity:.6}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:1.4rem;align-items:stretch}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;position:relative;animation:fadeUp .5s ease both;
  transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition)}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--card-accent-color)}
.card-appicon{width:96px;height:96px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:block}
.card-img-top{display:flex;justify-content:center;align-items:center;padding:18px 0 14px}
.card-img-circle{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;
  color:var(--card-accent-color);background:color-mix(in srgb,var(--card-accent-color) 10%,transparent);
  border:2px solid color-mix(in srgb,var(--card-accent-color) 30%,transparent);
  filter:drop-shadow(0 2px 10px color-mix(in srgb,var(--card-accent-color) 35%,transparent))}
.card-body{padding:1.3rem;display:flex;flex-direction:column;gap:.8rem;flex:1;border-top:3px solid var(--card-accent-color)}
.card-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;width:fit-content;border-radius:999px;
  font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--card-accent-color);
  background:color-mix(in srgb,var(--card-accent-color) 12%,transparent);border:1px solid var(--card-accent-color)}
.card h3{font-family:"Bebas Neue",sans-serif;font-size:1.45rem;letter-spacing:.06em;line-height:1.15;word-break:break-word}
.card p{font-size:.87rem;color:var(--text-muted);line-height:1.65;flex:1}
.card p.empty{font-style:italic;opacity:.7}
.card-meta{font-size:.74rem;color:var(--text-muted);font-weight:600;display:flex;gap:.8rem;flex-wrap:wrap}
.card-footer{display:flex;align-items:center;gap:.6rem;padding:0 1.3rem 1.3rem;flex-wrap:wrap}
.card-link{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;border-radius:9px;text-decoration:none;
  border:1.5px solid var(--card-accent-color);color:var(--card-accent-color);background:transparent;
  font-family:Nunito,sans-serif;font-weight:800;font-size:.83rem;
  transition:background var(--transition),color var(--transition),transform var(--transition)}
.card-link:hover{background:var(--card-accent-color);color:#fff;transform:translateX(3px)}
.card-link.ghost{border-color:var(--border);color:var(--text-muted)}
.card-link.ghost:hover{background:var(--surface2);color:var(--text)}
.card-link.off{opacity:.4;pointer-events:none}

.no-results{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:.95rem;font-weight:600}
.no-results i{font-size:2.5rem;opacity:.3;display:block;margin-bottom:.75rem}
.empty-sec{color:var(--text-muted);font-size:.88rem;font-weight:600;font-style:italic}
footer{position:relative;z-index:5;text-align:center;padding:1.5rem 2rem;color:var(--text-muted);font-size:.78rem;
  font-weight:600;letter-spacing:.05em;border-top:1px solid var(--border)}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width:600px){
  header,.hero,.controls,.grid-section{padding-left:1rem;padding-right:1rem}
  .controls{flex-direction:column;align-items:stretch}
  .search-wrapper{min-width:unset}
  .stats{gap:1.5rem}
  .btn-add span{display:none}
}
</style>

<style id="appicon-css">.appicon{width:40px;height:40px;border-radius:9px;vertical-align:middle;margin:0 10px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.25);flex:none;display:inline-block;object-fit:cover}
.appicon.big{width:72px;height:72px;border-radius:16px;margin:0 auto 10px;display:block}
.appicon.fill{width:100%;height:100%;margin:0;border-radius:inherit;box-shadow:none;display:block}
.appicon.logoimg{width:46px;height:46px;margin:0;border-radius:12px}
.test-banner{background:#facc15;color:#111;font:700 15px/1.3 system-ui,sans-serif;text-align:center;padding:8px 12px;position:relative;z-index:99999}
@media print{.appicon,.test-banner{display:none!important}}</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <img class="appicon logoimg" src="icon-192.png" alt="" width="46" height="46">
      <div class="logo-text">
        <h1>Mon EPS</h1>
        <p>Y. Dartois — Lycée Georges Pompidou</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="themeToggle" title="Changer de thème" aria-label="Changer de thème"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
      <a class="btn-add" id="ghlink" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> <span>Mes dépôts</span></a>
    </div>
  </div>
</header>

<section class="hero">
  <h2>Tous mes<br><span>outils EPS</span><br>au même endroit</h2>
  <p>Coordination, terrain et ressources — mis à jour automatiquement depuis GitHub.</p>
  <div class="stats" id="stats"></div>
</section>

<div class="controls">
  <div class="search-wrapper">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="search" id="searchInput" placeholder="Rechercher un outil…" autocomplete="off">
  </div>
  <div class="filters" id="filterPills"></div>
  <div class="filters">
    <button class="pill" id="sortBtn"><i class="fa-solid fa-arrow-down-a-z"></i> A → Z</button>
    <label class="pill opt"><input type="checkbox" id="onlyApps"> Apps en ligne</label>
  </div>
</div>

<main class="grid-section" id="content">
  <div class="no-results"><i class="fa-solid fa-spinner fa-spin"></i>Chargement des dépôts…</div>
</main>

<footer id="foot">Portail EPS</footer>

<script>
/* =========================================================
   CONFIGURATION — la seule partie à modifier
   ========================================================= */
const CONFIG = {
  user: "yannickdartois-hue",

  // Dépôts à ne jamais afficher (nom exact)
  exclude: ["yannickdartois-hue.github.io"],

  /* Les trois parties, dans l'ordre d'affichage.
     Un dépôt est rangé selon la PREMIÈRE règle qui marche :
       0. son nom contient "test"  → Autres, bloc « Pages de test »
       1. son nom figure dans "repos"          (le plus fiable)
       2. il porte le topic GitHub indiqué dans "topic"
       3. son nom contient un des groupes de "keywords"
          (un groupe = tous les mots doivent être présents)
       4. sinon → Autres                                           */
  sections: [
    {
      id: "coordo", title: "Coordo & outils", icon: "fa-folder-open", color: "#f97316",
      subtitle: "Évaluation, convocations, gestion de l'équipe",
      topic: "coordo",
      repos: [ /* ex. "marche30", "800m-ponctuel", "convocations-ccf" */ ],
      keywords: [["marche"], ["800"], ["convoc"], ["demi", "prof"], ["demifond", "prof"]],
    },
    {
      id: "terrain", title: "Terrain", icon: "fa-person-running", color: "#4ade80",
      subtitle: "Cours, cycles et outils utilisés avec les élèves",
      topic: "terrain",
      repos: [ /* ex. "volley-pompidou", "cycle-badminton" */ ],
      keywords: [["cycle"], ["volley"], ["badminton"], ["tennis"], ["ping"], ["step"],
                 ["training"], ["carnet"], ["tournoi"], ["demi"], ["demifond"], ["course"],
                 ["hand"], ["basket"], ["foot"], ["rugby"], ["acro"], ["danse"],
                 ["escalade"], ["natation"], ["muscu"], ["seance"], ["eleve"]],
    },
    {
      id: "autres", title: "Autres", icon: "fa-toolbox", color: "#a78bfa",
      subtitle: "Tout le reste",
      topic: "autres", repos: [], keywords: [],
    },
  ],

  // Tout dépôt dont le nom contient ce mot part dans "Autres", bloc à part. "" = désactivé.
  testWord: "test",

  // Icône de carte (Font Awesome) devinée d'après le nom — purement décoratif
  icons: [
    [["test"], "fa-flask"],
    [["volley"], "fa-volleyball"], [["badminton"], "fa-table-tennis-paddle-ball"],
    [["tennis"], "fa-table-tennis-paddle-ball"], [["ping"], "fa-table-tennis-paddle-ball"],
    [["basket"], "fa-basketball"], [["foot"], "fa-futbol"], [["hand"], "fa-hand"],
    [["800"], "fa-stopwatch"], [["demi"], "fa-stopwatch"], [["chrono"], "fa-stopwatch"],
    [["marche"], "fa-person-walking"], [["course"], "fa-person-running"],
    [["step"], "fa-music"], [["danse"], "fa-music"], [["training"], "fa-dumbbell"], [["muscu"], "fa-dumbbell"],
    [["convoc"], "fa-envelope-open-text"], [["tournoi"], "fa-trophy"],
    [["sst"], "fa-kit-medical"], [["pse"], "fa-kit-medical"], [["secour"], "fa-kit-medical"],
    [["carnet"], "fa-book-open"], [["brevet"], "fa-graduation-cap"], [["bac"], "fa-graduation-cap"],
    [["pronote"], "fa-user-shield"], [["service"], "fa-calendar-days"],
  ],

  // Surcharges facultatives par dépôt : title, description, icon, section
  overrides: {
    // "volley-pompidou": { title: "Cycle Volley — Terminale", icon: "fa-volleyball" },
    // "mon-depot": { section: "coordo" },
  },

  cacheMinutes: 30
};
/* ========================================================= */

/* Icônes des applis (dossier icons/, nom du dépôt en minuscules) */
const APPICONS = ["tennis-de-table","cycle-volley","volley-eleves","cycle-badminton","badminton-test","cycle-demi-fond","ccf-demi-fond-prof","carnet-numerique-demi-fond","800m-ponctuel","demi-fond-test","demi-fond-test-pro","demi-fond-test-prof","marche-30min","cycle-step","carnet-step-","cross-training-pompidou","crosstraingtest","mon-eps","convocations-ccf-eps","convocations-as-pompidou","brevet2026"];
const $ = id => document.getElementById(id);
const state = { repos: [], sec: "all", q: "", sort: "name", onlyApps: false };
const FALLBACK = CONFIG.sections.at(-1).id;
const SEC = Object.fromEntries(CONFIG.sections.map(s => [s.id, s]));

$("ghlink").href = `https://github.com/${CONFIG.user}?tab=repositories`;

/* ---------- Thème ---------- */
function applyThemeIcon(){
  $("themeIcon").className = "fa-solid " + (document.documentElement.dataset.theme === "light" ? "fa-sun" : "fa-moon");
}
$("themeToggle").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("portail-theme", t); } catch(e){}
  applyThemeIcon();
});
applyThemeIcon();

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const matches = (name, groups) => groups.some(g => g.every(w => name.includes(norm(w))));
const isTest = r => !!CONFIG.testWord && norm(r.name).includes(norm(CONFIG.testWord));

function prettify(name){
  return name.replace(/[-_.]+/g," ").replace(/\s+/g," ").trim().replace(/^./, c => c.toUpperCase());
}
function sectionOf(r){
  const o = CONFIG.overrides[r.name];
  if (o && o.section) return o.section;
  const n = norm(r.name);
  if (isTest(r)) return FALLBACK;
  for (const s of CONFIG.sections) if (s.repos.some(x => norm(x) === n)) return s.id;
  for (const s of CONFIG.sections) if ((r.topics || []).includes(s.topic)) return s.id;
  for (const s of CONFIG.sections) if (matches(n, s.keywords)) return s.id;
  return FALLBACK;
}
function iconOf(r, sec){
  const hit = CONFIG.icons.find(([g]) => matches(norm(r.name), [g]));
  return hit ? hit[1] : sec.icon;
}
function pagesUrl(r){
  if (r.homepage) return r.homepage;
  if (!r.has_pages) return null;
  if (norm(r.name) === norm(`${CONFIG.user}.github.io`)) return `https://${CONFIG.user}.github.io/`;
  return `https://${CONFIG.user}.github.io/${r.name}/`;
}
function rel(d){
  const days = Math.floor((Date.now() - new Date(d)) / 864e5);
  if (days < 1) return "aujourd'hui";
  if (days === 1) return "hier";
  if (days < 30) return `il y a ${days} j`;
  if (days < 365) return `il y a ${Math.floor(days/30)} mois`;
  return `il y a ${Math.floor(days/365)} an${days >= 730 ? "s" : ""}`;
}

/* ---------- Chargement ---------- */
async function fetchRepos(){
  // 1) repos.json généré par la GitHub Action
  try {
    const res = await fetch("repos.json?v=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      return { list: data.repos, from: "json", generated: data.generated_at };
    }
  } catch(e){}
  // 2) Repli : API GitHub en direct (test en local, ou Action pas encore lancée)
  const key = "portail-repos-" + CONFIG.user;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key)); } catch(e){}
  if (cached && Date.now() - cached.t < CONFIG.cacheMinutes * 6e4) return { list: cached.list, from: "cache" };
  try {
    let all = [], page = 1;
    while (true) {
      const res = await fetch(`https://api.github.com/users/${CONFIG.user}/repos?per_page=100&page=${page}`,
                              { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(res.status === 403 ? "limite de l'API GitHub atteinte" : "erreur " + res.status);
      const batch = await res.json();
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++;
    }
    const list = all.map(r => ({
      name: r.name, description: r.description, html_url: r.html_url, homepage: r.homepage,
      has_pages: r.has_pages, language: r.language, updated_at: r.pushed_at || r.updated_at,
      fork: r.fork, archived: r.archived, topics: r.topics || []
    }));
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), list })); } catch(e){}
    return { list, from: "api" };
  } catch (err) {
    if (cached) return { list: cached.list, from: "stale", err };
    throw err;
  }
}

function prepare(list){
  return list
    .filter(r => !r.fork && !CONFIG.exclude.includes(r.name))
    .map(r => {
      const o = CONFIG.overrides[r.name] || {};
      const sec = SEC[sectionOf(r)] || SEC[FALLBACK];
      return { ...r, sec: sec.id, test: sec.id === FALLBACK && isTest(r),
        title: o.title || prettify(r.name),
        desc: o.description || r.description || "",
        icon: o.icon || iconOf(r, sec),
        app: pagesUrl(r) };
    });
}

/* ---------- Affichage ---------- */
function filtered(){
  const q = norm(state.q);
  const items = state.repos.filter(r =>
    (!state.onlyApps || r.app) &&
    (!q || norm(r.title + " " + r.name + " " + r.desc + " " + (r.topics||[]).join(" ")).includes(q)));
  items.sort(state.sort === "name"
    ? (a,b) => a.title.localeCompare(b.title, "fr")
    : (a,b) => String(b.updated_at).localeCompare(String(a.updated_at)));
  return items;
}

function card(r, s, i){
  return `
  <article class="card" style="--card-accent-color:${s.color};animation-delay:${Math.min(i,8)*.05}s">
    <div class="card-img-top">${APPICONS.includes(r.name.toLowerCase()) ? `<img class="card-appicon" src="icons/${esc(r.name.toLowerCase())}.png" alt="" width="96" height="96" loading="lazy">` : `<div class="card-img-circle"><i class="fa-solid ${esc(r.icon)}"></i></div>`}</div>
    <div class="card-body">
      <span class="card-badge"><i class="fa-solid ${r.test ? "fa-flask" : s.icon}"></i> ${r.test ? "Test" : esc(s.title)}</span>
      <h3>${esc(r.title)}</h3>
      <p class="${r.desc ? "" : "empty"}">${r.desc ? esc(r.desc) : "Pas de description."}</p>
      <div class="card-meta"><span><i class="fa-regular fa-clock"></i> ${rel(r.updated_at)}</span>${r.archived ? `<span><i class="fa-solid fa-box-archive"></i> archivé</span>` : ""}</div>
    </div>
    <div class="card-footer">
      <a class="card-link ${r.app ? "" : "off"}" href="${r.app ? esc(r.app) : "#"}" target="_blank" rel="noopener noreferrer">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> ${r.app ? "Ouvrir le site" : "Pas de site"}</a>
      <a class="card-link ghost" href="${esc(r.html_url)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> Code</a>
    </div>
  </article>`;
}

function sectionBody(list, s){
  if (!list.length) return `<div class="empty-sec">Rien ici pour l'instant.</div>`;
  const normal = list.filter(r => !r.test), tests = list.filter(r => r.test);
  let html = normal.length ? `<div class="cards-grid">${normal.map((r,i) => card(r, s, i)).join("")}</div>` : "";
  if (tests.length) html += `
    <div class="sub-label"><i class="fa-solid fa-flask"></i> Pages de test (${tests.length})</div>
    <div class="cards-grid">${tests.map((r,i) => card(r, s, i)).join("")}</div>`;
  return html;
}

function render(){
  const items = filtered();
  const by = Object.fromEntries(CONFIG.sections.map(s => [s.id, []]));
  items.forEach(r => (by[r.sec] || by[FALLBACK]).push(r));

  $("filterPills").innerHTML =
    `<button class="pill ${state.sec==="all"?"active":""}" data-s="all">Tout (${items.length})</button>` +
    CONFIG.sections.map(s =>
      `<button class="pill ${state.sec===s.id?"active":""}" data-s="${s.id}" style="--pc:${s.color}"><i class="fa-solid ${s.icon}"></i> ${esc(s.title)} (${by[s.id].length})</button>`).join("");

  const pool = state.repos.filter(r => !state.onlyApps || r.app);
  $("stats").innerHTML = CONFIG.sections.map(s =>
      `<div class="stat" style="--c:${s.color}"><div class="stat-num">${pool.filter(r => r.sec === s.id).length}</div><div class="stat-label">${esc(s.title)}</div></div>`).join("") +
    `<div class="stat" style="--c:var(--accent-2)"><div class="stat-num">${pool.filter(r => r.app).length}</div><div class="stat-label">Apps en ligne</div></div>`;

  if (state.q && !items.length) {
    $("content").innerHTML = `<div class="no-results"><i class="fa-solid fa-magnifying-glass"></i>Aucun outil ne correspond à « ${esc(state.q)} ».</div>`;
    return;
  }
  $("content").innerHTML = CONFIG.sections
    .filter(s => state.sec === "all" || state.sec === s.id)
    .filter(s => !state.q || by[s.id].length)
    .map(s => `
      <section style="--sc:${s.color}">
        <div class="category-label"><i class="fa-solid ${s.icon}" style="color:${s.color}"></i> ${esc(s.title)} <span class="n">${by[s.id].length}</span></div>
        <div class="category-sub">${esc(s.subtitle)}</div>
        ${sectionBody(by[s.id], s)}
      </section>`).join("");
}

$("filterPills").addEventListener("click", e => {
  const b = e.target.closest(".pill"); if (!b) return;
  state.sec = b.dataset.s; render();
});
$("searchInput").addEventListener("input", e => { state.q = e.target.value; render(); });
$("sortBtn").addEventListener("click", () => {
  state.sort = state.sort === "name" ? "updated" : "name";
  $("sortBtn").innerHTML = state.sort === "name"
    ? `<i class="fa-solid fa-arrow-down-a-z"></i> A → Z`
    : `<i class="fa-regular fa-clock"></i> Plus récents`;
  render();
});
$("onlyApps").addEventListener("change", e => { state.onlyApps = e.target.checked; render(); });

fetchRepos().then(({ list, from, err, generated }) => {
  state.repos = prepare(list);
  render();
  $("foot").textContent =
    from === "stale" ? `GitHub indisponible (${err.message}) — liste affichée depuis le cache local.`
    : from === "json" ? `Portail EPS — Y. Dartois · liste actualisée ${rel(generated)}`
    : `Portail EPS — Y. Dartois · liste chargée en direct depuis GitHub`;
}).catch(err => {
  $("content").innerHTML = `<div class="no-results"><i class="fa-solid fa-triangle-exclamation"></i>Impossible de charger les dépôts : ${esc(err.message)}.<br>Réessaie dans quelques minutes.</div>`;
});
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
