<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon EPS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon EPS — Y. Dartois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>try{const t=localStorage.getItem("portail-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --surface2:#1f252e; --border:#2a313b;
  --text:#e6edf3; --text-muted:#8b949e;
  --accent:#f97316; --accent-2:#22d3ee;
  --radius:16px; --t:.2s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f3f5f8; --surface:#fff; --surface2:#eef1f5; --border:#dde2e8;
  --text:#1c2128; --text-muted:#5b6470;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 40% at 15% 0%,rgba(249,115,22,.08),transparent 60%),
             radial-gradient(50% 40% at 90% 100%,rgba(34,211,238,.05),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 1.25rem}

/* ---------- En-tête compact ---------- */
header{padding:calc(1.1rem + env(safe-area-inset-top)) 0 .6rem}
.head{display:flex;align-items:center;gap:.8rem}
.head img{width:44px;height:44px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);flex:none}
.head-txt{flex:1;min-width:0}
.head h1{font-family:"Bebas Neue",sans-serif;font-size:1.9rem;letter-spacing:.06em;line-height:1}
.head h1 span{color:var(--accent)}
.head p{font-size:.74rem;color:var(--text-muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-icon{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-muted);display:grid;place-items:center;font-size:.95rem;cursor:pointer;text-decoration:none;flex:none;
  transition:color var(--t),background var(--t)}
.btn-icon:hover{color:var(--text);background:var(--surface2)}

/* ---------- Barre collante : recherche + activités ---------- */
.bar{position:sticky;top:0;z-index:20;padding:.6rem 0 .5rem;margin-bottom:.2rem;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;transition:border-color var(--t)}
.bar.stuck{border-bottom-color:var(--border)}
.search{position:relative}
.search i{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem}
#q{width:100%;padding:.7rem .9rem .7rem 2.5rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font:600 16px/1.2 Nunito,sans-serif;outline:none;transition:border-color var(--t),box-shadow var(--t)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
#q::placeholder{color:var(--text-muted)}
.chips{display:flex;gap:.45rem;margin-top:.55rem;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  mask-image:linear-gradient(90deg,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;
  font:700 .8rem Nunito,sans-serif;white-space:nowrap;transition:all var(--t)}
.chip i{color:var(--c,var(--text-muted));font-size:.78rem}
.chip:hover{color:var(--text)}
.chip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.chip.on i{color:#fff}

/* ---------- Grandes parties ---------- */
main{padding-bottom:3rem}
.part{margin-top:1.6rem}
.part-head{display:flex;align-items:baseline;gap:.6rem;padding-bottom:.45rem;border-bottom:2px solid var(--pc)}
.part-head h2{font-family:"Bebas Neue",sans-serif;font-size:1.75rem;letter-spacing:.07em;line-height:1}
.part-head h2 i{color:var(--pc);font-size:1.15rem;margin-right:.35rem;vertical-align:.12em}
.part-head small{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--text-muted)}

/* ---------- Activités ---------- */
.act{margin-top:1rem}
.act-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;
  font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.act-head .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:.68rem;
  color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.55rem}

/* ---------- Ligne outil ---------- */
.tool{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  transition:border-color var(--t),transform var(--t),background var(--t);animation:in .35s ease both}
.tool:hover{border-color:color-mix(in srgb,var(--ac) 60%,var(--border))}
.tool:active{transform:scale(.985)}
.tool .main{flex:1;min-width:0;display:flex;align-items:center;gap:.8rem;padding:.6rem .4rem .6rem .6rem;
  color:inherit;text-decoration:none}
.ico{width:52px;height:52px;border-radius:13px;flex:none;overflow:hidden;display:grid;place-items:center;
  font-size:1.3rem;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);
  box-shadow:0 2px 8px rgba(0,0,0,.22)}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.txt{min-width:0;flex:1}
.txt strong{display:block;font-size:.98rem;font-weight:800;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt span{display:block;font-size:.78rem;color:var(--text-muted);font-weight:600;margin-top:.12rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{color:var(--text-muted);font-size:.8rem;padding:0 .2rem;flex:none}
.tool .main:hover .go{color:var(--ac)}
.tool.nosite .main{cursor:default}
.tool.nosite .ico{filter:grayscale(1);opacity:.55}
.tag{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:.05rem .4rem;border-radius:5px;margin-right:.35rem;vertical-align:.08em;
  color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.code{flex:none;align-self:stretch;width:44px;display:grid;place-items:center;border-left:1px solid var(--border);
  color:var(--text-muted);text-decoration:none;font-size:1rem;opacity:.55;transition:opacity var(--t),color var(--t)}
.code:hover{opacity:1;color:var(--text)}

/* ---------- Tests (repliés) ---------- */
details.part{border:1px dashed var(--border);border-radius:var(--radius);padding:.2rem .9rem .9rem;margin-top:2.2rem}
details.part > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.6rem;padding:.7rem 0 .2rem;
  font-family:"Bebas Neue",sans-serif;font-size:1.4rem;letter-spacing:.07em;color:var(--text-muted)}
details.part > summary::-webkit-details-marker{display:none}
details.part > summary small{margin-left:auto;font-family:Nunito,sans-serif;font-size:.75rem;font-weight:700}
details.part > summary .chev{transition:transform var(--t);font-size:.8rem}
details[open].part > summary .chev{transform:rotate(90deg)}
details.part .tool{opacity:.85}

.msg{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-weight:600}
.msg i{font-size:2.2rem;opacity:.35;display:block;margin-bottom:.7rem}
footer{position:relative;z-index:1;text-align:center;padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom));
  color:var(--text-muted);font-size:.74rem;font-weight:600;border-top:1px solid var(--border)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:700px){
  .wrap{padding:0 2rem}
  .head h1{font-size:2.3rem}
  .chips{flex-wrap:wrap;mask-image:none;-webkit-mask-image:none}
}
@media (prefers-reduced-motion:reduce){.tool{animation:none}}
</style>
</head>
<body>

<header class="wrap">
  <div class="head">
    <img src="icon-192.png" alt="" width="44" height="44">
    <div class="head-txt">
      <h1>Mon <span>EPS</span></h1>
      <p>Y. Dartois · Lycée Georges Pompidou</p>
    </div>
    <button class="btn-icon" id="themeToggle" aria-label="Changer de thème"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
    <a class="btn-icon" id="ghlink" target="_blank" rel="noopener" aria-label="Mes dépôts GitHub"><i class="fa-brands fa-github"></i></a>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="q" placeholder="Rechercher un outil…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap" id="content">
  <div class="msg"><i class="fa-solid fa-spinner fa-spin"></i>Chargement des outils…</div>
</main>

<footer id="foot">Mon EPS</footer>

<script>
/* =========================================================
   CONFIGURATION — la seule partie à modifier
   ========================================================= */
const CONFIG = {
  user: "yannickdartois-hue",

  // Dépôts jamais affichés (le portail lui-même, etc.)
  exclude: ["yannickdartois-hue.github.io", "mon-eps", "carnet-numerique-demi-fond"],   /* l'ancien carnet renvoie vers les applis demi-fond élève et prof */

  /* Grandes parties, dans l'ORDRE D'AFFICHAGE.
     Un dépôt va dans la première partie dont une règle marche :
       0. son nom contient "test" → partie « Tests » (toujours en dernier, repliée)
       1. son nom figure dans "repos"   (le plus fiable : à remplir)
       2. il porte le topic GitHub "topic"
       3. son nom contient un des groupes de "keywords" (tous les mots du groupe)
       4. sinon → Autres
     Les parties sont testées dans l'ordre de "matchOrder" (coordo avant terrain,
     pour que « ccf-demi-fond-prof » ne parte pas en Terrain).                    */
  parts: [
    { id: "terrain", title: "Sur le terrain", icon: "fa-person-running", color: "#4ade80",
      topic: "terrain",
      repos: ["cycle-volley", "volley-eleves", "volley-pompidou", "cycle-badminton", "tennis-de-table", "tennis-de-table-eleves", "tennis-de-table-prof",
              "cycle-demi-fond", "demi-fond-eleves", "demi-fond-prof", "carnet-numerique-demi-fond", "cycle-step", "carnet-step-",
              "cross-training-pompidou"],
      keywords: [["cycle"], ["volley"], ["badminton"], ["tennis"], ["ping"], ["step"], ["training"],
                 ["carnet"], ["tournoi"], ["demi"], ["course"], ["hand"], ["basket"], ["foot"], ["rugby"],
                 ["acro"], ["danse"], ["escalade"], ["natation"], ["muscu"], ["seance"], ["eleve"]] },
    { id: "coordo", title: "Coordo & évaluation", icon: "fa-clipboard-check", color: "#f97316",
      topic: "coordo",
      repos: ["ccf-demi-fond-prof", "800m-ponctuel", "marche-30min", "convocations-ccf-eps", "convocations-as-pompidou"],
      keywords: [["marche"], ["800"], ["convoc"], ["ccf"], ["demi", "prof"], ["pronote"], ["service"], ["sst"], ["pv"]] },
    { id: "autres", title: "Autres", icon: "fa-toolbox", color: "#a78bfa",
      topic: "autres", repos: [], keywords: [] },
  ],
  matchOrder: ["coordo", "terrain", "autres"],
  testWord: "test",

  /* Activités : sous-groupes à l'intérieur de chaque partie, dans cet ordre.
     Premier groupe de mots qui correspond au nom du dépôt.                     */
  activities: [
    { id: "volley",    label: "Volley-ball",      icon: "fa-volleyball",              color: "#facc15", keywords: [["volley"]] },
    { id: "badminton", label: "Badminton",        icon: "fa-feather-pointed",             color: "#22d3ee", keywords: [["badminton"]] },
    { id: "tt",        label: "Tennis de table",  icon: "fa-table-tennis-paddle-ball", color: "#f472b6", keywords: [["tennis"], ["ping"]] },
    { id: "demifond",  label: "Demi-fond",        icon: "fa-stopwatch",               color: "#fb923c", keywords: [["demi"], ["800"], ["course"]] },
    { id: "step",      label: "Step",             icon: "fa-music",                   color: "#c084fc", keywords: [["step"]] },
    { id: "cross",     label: "Cross training",   icon: "fa-dumbbell",                color: "#4ade80", keywords: [["cross"], ["training"], ["muscu"]] },
    { id: "marche",    label: "Marche",           icon: "fa-person-walking",          color: "#a3e635", keywords: [["marche"]] },
    { id: "basket",    label: "Basket-ball",      icon: "fa-basketball",              color: "#fb7185", keywords: [["basket"]] },
    { id: "hand",      label: "Handball",         icon: "fa-hand",                    color: "#60a5fa", keywords: [["hand"]] },
    { id: "foot",      label: "Football",         icon: "fa-futbol",                  color: "#34d399", keywords: [["foot"]] },
    { id: "danse",     label: "Danse / Acrosport",icon: "fa-person-rays",             color: "#e879f9", keywords: [["danse"], ["acro"]] },
    { id: "secours",   label: "Secourisme",       icon: "fa-kit-medical",             color: "#f87171", keywords: [["sst"], ["pse"], ["secour"]] },
    { id: "examens",   label: "Examens & convocations", icon: "fa-envelope-open-text", color: "#f97316", keywords: [["convoc"], ["ccf"], ["brevet"], ["bac"]] },
  ],
  otherActivity: { id: "divers", label: "Divers", icon: "fa-shapes", color: "#94a3b8" },

  // Surcharges facultatives : title, description, part, activity, icon
  overrides: {
    "ccf-demi-fond-prof":         { title: "CCF demi-fond — prof", activity: "demifond" },
    "800m-ponctuel":              { title: "800 m ponctuel" },
    "carnet-numerique-demi-fond": { title: "Carnet numérique demi-fond" },
    "cycle-demi-fond":            { title: "Cycle demi-fond" },
    "demi-fond-eleves":           { title: "Demi-fond — app élèves", activity: "demifond" },
    "demi-fond-prof":             { title: "Demi-fond — outil prof", activity: "demifond" },
    "carnet-step-":               { title: "Carnet step" },
    "cycle-step":                 { title: "Cycle step" },
    "marche-30min":               { title: "Marche 30 min" },
    "convocations-ccf-eps":       { title: "Convocations CCF EPS", activity: "examens" },
    "convocations-as-pompidou":   { title: "Convocations AS / UNSS", activity: "examens" },
    "cross-training-pompidou":    { title: "Cross training Pompidou" },
    "tennis-de-table":            { title: "Cycle tennis de table" },
    "volley-eleves":              { title: "Volley — app élèves" },
    "tennis-de-table-eleves":     { title: "Tennis de table — app élèves" },
    "tennis-de-table-prof":       { title: "Tennis de table — outil prof" },
    "cycle-volley":               { title: "Cycle volley-ball" },
    "brevet2026":                 { title: "Brevet 2026" },
    // "volley-pompidou": { title: "Cycle Volley — Terminale", icon: "fa-volleyball" },
    // "mon-depot": { section: "coordo" },
  },

  // Sigles remis en majuscules dans les titres automatiques
  acronyms: ["ccf", "eps", "as", "unss", "sst", "pse", "cap", "bac", "pv", "qr"],
  cacheMinutes: 30
};
/* ========================================================= */

/* Icône partagée selon des mots du nom du dépôt : [mots requis, fichier dans icons/ sans .png] */
const ICONRULES = [ [["tournoi", "volley"], "tournoi-volley"] ];
/* Icônes d'applis présentes dans le dossier icons/ (nom du dépôt en minuscules) */
const APPICONS = ["tennis-de-table","tennis-de-table-eleves","tennis-de-table-prof","cycle-volley","volley-eleves","cycle-badminton","badminton-test","cycle-demi-fond","demi-fond-eleves","demi-fond-prof","ccf-demi-fond-prof","carnet-numerique-demi-fond","800m-ponctuel","demi-fond-test","demi-fond-test-pro","demi-fond-test-prof","marche-30min","cycle-step","carnet-step-","cross-training-pompidou","crosstraingtest","convocations-ccf-eps","convocations-as-pompidou","brevet2026"];

const $ = id => document.getElementById(id);
const state = { repos: [], act: "all", q: "" };
const OVR = Object.fromEntries(Object.entries(CONFIG.overrides).map(([k,v]) => [k.toLowerCase(), v]));
const ovr = r => OVR[r.name.toLowerCase()] || {};
const PART = Object.fromEntries(CONFIG.parts.map(p => [p.id, p]));
const ACT = Object.fromEntries(CONFIG.activities.concat(CONFIG.otherActivity).map(a => [a.id, a]));
const FALLBACK = "autres";

$("ghlink").href = `https://github.com/${CONFIG.user}?tab=repositories`;

/* ---------- Thème ---------- */
function themeIcon(){ $("themeIcon").className = "fa-solid " + (document.documentElement.dataset.theme === "light" ? "fa-sun" : "fa-moon"); }
$("themeToggle").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("portail-theme", t); } catch(e){}
  themeIcon();
});
themeIcon();

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const matches = (name, groups) => groups.some(g => g.every(w => name.includes(norm(w))));
const isTest = r => !!CONFIG.testWord && norm(r.name).includes(norm(CONFIG.testWord));

function prettify(name){
  const words = name.replace(/[-_.]+/g," ").trim().split(/\s+/)
    .map(w => CONFIG.acronyms.includes(w.toLowerCase()) ? w.toUpperCase() : w.toLowerCase());
  const s = words.join(" ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function partOf(r){
  const o = ovr(r);
  if (o.part) return o.part;
  const n = norm(r.name);
  const ordered = CONFIG.matchOrder.map(id => PART[id]);
  for (const p of ordered) if (p.repos.some(x => norm(x) === n)) return p.id;
  for (const p of ordered) if ((r.topics || []).includes(p.topic)) return p.id;
  for (const p of ordered) if (matches(n, p.keywords)) return p.id;
  return FALLBACK;
}
function activityOf(r){
  const o = ovr(r);
  if (o.activity) return o.activity;
  const n = norm(r.name);
  const hit = CONFIG.activities.find(a => matches(n, a.keywords));
  return hit ? hit.id : CONFIG.otherActivity.id;
}
function pagesUrl(r){
  if (r.homepage) return r.homepage;
  if (!r.has_pages) return null;
  return `https://${CONFIG.user}.github.io/${r.name}/`;
}
function rel(d){
  const days = Math.floor((Date.now() - new Date(d)) / 864e5);
  if (days < 1) return "aujourd'hui";
  if (days === 1) return "hier";
  if (days < 30) return `il y a ${days} j`;
  if (days < 365) return `il y a ${Math.floor(days/30)} mois`;
  return `il y a ${Math.floor(days/365)} an${days >= 730 ? "s" : ""}`;
}

/* ---------- Chargement ---------- */
async function fetchRepos(){
  try {
    const res = await fetch("repos.json?v=" + Date.now(), { cache: "no-store" });
    if (res.ok) { const d = await res.json(); return { list: d.repos, from: "json", generated: d.generated_at }; }
  } catch(e){}
  const key = "portail-repos-" + CONFIG.user;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key)); } catch(e){}
  if (cached && Date.now() - cached.t < CONFIG.cacheMinutes * 6e4) return { list: cached.list, from: "cache" };
  try {
    let all = [], page = 1;
    while (true) {
      const res = await fetch(`https://api.github.com/users/${CONFIG.user}/repos?per_page=100&page=${page}`,
                              { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(res.status === 403 ? "limite de l'API GitHub atteinte" : "erreur " + res.status);
      const batch = await res.json();
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++;
    }
    const list = all.map(r => ({ name: r.name, description: r.description, html_url: r.html_url, homepage: r.homepage,
      has_pages: r.has_pages, updated_at: r.pushed_at || r.updated_at, fork: r.fork, archived: r.archived, topics: r.topics || [] }));
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), list })); } catch(e){}
    return { list, from: "api" };
  } catch (err) {
    if (cached) return { list: cached.list, from: "stale", err };
    throw err;
  }
}

function prepare(list){
  const ex = CONFIG.exclude.map(norm);
  return list
    .filter(r => !r.fork && !r.archived && !ex.includes(norm(r.name)))
    .map(r => {
      const o = ovr(r);
      const test = isTest(r) && !o.part;
      return { ...r, test,
        part: test ? "tests" : partOf(r),
        act: activityOf(r),
        title: o.title || prettify(r.name),
        desc: o.description || r.description || "",
        icon: o.icon || null,
        app: o.app || pagesUrl(r) };
    });
}

/* ---------- Affichage ---------- */
function visible(){
  const q = norm(state.q);
  return state.repos.filter(r =>
    (state.act === "all" || r.act === state.act) &&
    (!q || norm(`${r.title} ${r.name} ${r.desc} ${ACT[r.act].label} ${(r.topics||[]).join(" ")}`).includes(q)));
}

function tool(r, i, showAct){
  const a = ACT[r.act];
  const rule = ICONRULES.find(([g]) => matches(norm(r.name), [g]));
  const iconName = rule ? rule[1] : r.name.toLowerCase();
  const ico = (rule || APPICONS.includes(iconName))
    ? `<img src="icons/${esc(iconName)}.png" alt="" width="52" height="52" loading="lazy">`
    : `<i class="fa-solid ${esc(r.icon || a.icon)}"></i>`;
  const sub = (showAct ? `<em class="tag">${esc(a.label)}</em>` : "") +
              esc(r.desc || (r.app ? "" : "Pas encore en ligne"));
  const inner = `<div class="ico">${ico}</div>
      <div class="txt"><strong>${esc(r.title)}</strong>${sub ? `<span>${sub}</span>` : ""}</div>
      ${r.app ? `<i class="fa-solid fa-chevron-right go"></i>` : ""}`;
  return `<div class="tool ${r.app ? "" : "nosite"}" style="--ac:${a.color};animation-delay:${Math.min(i,10)*.03}s">
    ${r.app ? `<a class="main" href="${esc(r.app)}" target="_blank" rel="noopener">${inner}</a>`
            : `<div class="main">${inner}</div>`}
    <a class="code" href="${esc(r.html_url)}" target="_blank" rel="noopener" title="Voir le code" aria-label="Code de ${esc(r.title)}"><i class="fa-brands fa-github"></i></a>
  </div>`;
}

function byActivity(items){
  const order = CONFIG.activities.map(a => a.id).concat(CONFIG.otherActivity.id);
  return order.map(id => [ACT[id], items.filter(r => r.act === id)
      .sort((x,y) => x.title.localeCompare(y.title, "fr"))])
    .filter(([, l]) => l.length);
}

function partBlock(p, items){
  const groups = byActivity(items);
  const flat = groups.length === 1 || state.act !== "all";
  const body = flat
    ? `<div class="list">${groups.flatMap(([, l]) => l).map((r,i) => tool(r, i, false)).join("")}</div>`
    : groups.map(([a, l]) => `
        <div class="act" style="--ac:${a.color}">
          <div class="act-head"><span class="dot"><i class="fa-solid ${a.icon}"></i></span>${esc(a.label)}</div>
          <div class="list">${l.map((r,i) => tool(r, i, false)).join("")}</div>
        </div>`).join("");
  return `<section class="part" style="--pc:${p.color}">
    <div class="part-head"><h2><i class="fa-solid ${p.icon}"></i>${esc(p.title)}</h2><small>${items.length} outil${items.length>1?"s":""}</small></div>
    ${body}
  </section>`;
}

function testsBlock(items){
  const open = !!state.q || state.act !== "all";
  const list = items.sort((x,y) => x.title.localeCompare(y.title, "fr"));
  return `<details class="part" ${open ? "open" : ""}>
    <summary><i class="fa-solid fa-chevron-right chev"></i><i class="fa-solid fa-flask"></i> Pages de test<small>${items.length}</small></summary>
    <div class="list" style="margin-top:.6rem">${list.map((r,i) => tool(r, i, true)).join("")}</div>
  </details>`;
}

function renderChips(){
  const used = new Set(state.repos.filter(r => !r.test).map(r => r.act));
  const acts = CONFIG.activities.concat(CONFIG.otherActivity).filter(a => used.has(a.id));
  $("chips").innerHTML =
    `<button class="chip ${state.act==="all"?"on":""}" data-a="all">Tout</button>` +
    acts.map(a => `<button class="chip ${state.act===a.id?"on":""}" data-a="${a.id}" style="--c:${a.color}"><i class="fa-solid ${a.icon}"></i>${esc(a.label)}</button>`).join("");
}

function render(){
  renderChips();
  const items = visible();
  if (!items.length) {
    $("content").innerHTML = `<div class="msg"><i class="fa-solid fa-magnifying-glass"></i>Aucun outil ne correspond${state.q ? ` à « ${esc(state.q)} »` : ""}.</div>`;
    return;
  }
  let html = CONFIG.parts
    .map(p => [p, items.filter(r => r.part === p.id)])
    .filter(([, l]) => l.length)
    .map(([p, l]) => partBlock(p, l)).join("");
  const tests = items.filter(r => r.part === "tests");
  if (tests.length) html += testsBlock(tests);
  $("content").innerHTML = html;
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.act = b.dataset.a; render();
  b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
});
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });

/* Ombre de la barre collante */
new IntersectionObserver(([e]) => $("bar").classList.toggle("stuck", !e.isIntersecting))
  .observe(document.querySelector("header"));

fetchRepos().then(({ list, from, err, generated }) => {
  state.repos = prepare(list);
  render();
  $("foot").textContent =
    from === "stale" ? `GitHub indisponible (${err.message}) — liste affichée depuis l'appareil.`
    : from === "json" ? `Mon EPS — Y. Dartois · liste actualisée ${rel(generated)}`
    : `Mon EPS — Y. Dartois · liste à jour depuis GitHub`;
}).catch(err => {
  $("content").innerHTML = `<div class="msg"><i class="fa-solid fa-triangle-exclamation"></i>Impossible de charger les outils : ${esc(err.message)}.<br>Réessaie dans quelques minutes.</div>`;
});
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
